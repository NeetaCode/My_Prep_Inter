<!DOCTYPE html>
<html>
<head>
  <title>My Learning</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    .section {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
    }

    summary {
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      padding: 10px 0;
      outline: none;
    }

    pre {
      background: #eee;
      padding: 15px;
      border-radius: 5px;
      white-space: pre-wrap;
    }

    /* Behavioral Q&A styling */
    #beh-controls {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-bottom: 10px;
      margin-top: 5px;
    }

    #showAllBeh,
    #collapseBeh {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      background: #007bff;
      color: white;
    }

    #showAllBeh:hover,
    #collapseBeh:hover {
      opacity: 0.9;
    }

    .main-question-block {
      margin-bottom: 12px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .question-btn {
      width: 100%;
      text-align: left;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f0f0f0;
      cursor: pointer;
    }

    .question-btn:hover {
      background: #e5e5e5;
    }

    .subquestions {
      margin-top: 6px;
      margin-left: 15px;
      display: none; /* hidden until main question clicked */
    }

    .subquestion-btn {
      width: 100%;
      text-align: left;
      padding: 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fafafa;
      cursor: pointer;
      margin-top: 4px;
    }

    .subquestion-btn:hover {
      background: #f1f1f1;
    }

    .answer {
      margin-top: 4px;
      display: none; /* hidden by default */
    }

    /* Implemented Projects / AI SWE styling */
    .subsection-title {
      margin-top: 10px;
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1>📘 My Learning Hub</h1>

<!-- Section 1: Behavioral Questions (collapsible) -->
<details class="section" id="beh-section">
  <summary>1. Behavioral Questions</summary>

  <div id="beh-controls">
    <button id="showAllBeh">Show all answers</button>
    <button id="collapseBeh">Hide section</button>
  </div>

  <div id="beh-questions">
    <!-- Main questions, subquestions, and answers will be injected here -->
  </div>
</details>

<!-- Section 2 -->
<details class="section">
  <summary>2. Leetcode Problems</summary>
  <pre id="leet"></pre>
</details>

<!-- Section 3: Implemented Projects / AI SWE Interview Prep -->
<details class="section">
  <summary>3. Implemented Projects / AI SWE Interview Prep</summary>

  <div class="subsection-title">AI Software Engineer Interview Questions</div>
  <pre id="ai-questions"></pre>

  <div class="subsection-title">Recommended AI Interview Question Resources</div>
  <pre id="ai-resources"></pre>

  <div class="subsection-title">Work Experience</div>
  <pre id="ai-work"></pre>

  <div class="subsection-title">Projects</div>
  <pre id="ai-projects"></pre>
</details>

<!-- Section 4 -->
<details class="section">
  <summary>4. System Design</summary>
  <pre id="sys"></pre>
</details>

<script>
  // Helper to load simple text files into <pre>
  function loadFile(id, file) {
    fetch(file)
      .then(response => response.text())
      .then(text => document.getElementById(id).textContent = text)
      .catch(err => document.getElementById(id).textContent = "Error loading " + file);
  }

  // Load Leetcode / System Design as plain text
  loadFile("leet", "Leetcode Problems.txt");
  loadFile("sys", "System Design.txt");

  /**
   * Load and parse Behavioral Questions.txt into:
   *  - main questions:  "1. ...", "2. ..."
   *  - subquestions:    "1.1. ...", "1.2. ..."
   *  - default answers for mains that have no subquestions
   */
  function loadBehavioralQA(file) {
    fetch(file)
      .then(response => response.text())
      .then(text => {
        const container = document.getElementById("beh-questions");
        const lines = text.split(/\r?\n/);

        const mainQuestions = [];
        let currentMain = null;
        let currentSub = null;

        for (let rawLine of lines) {
          const line = rawLine;
          const trimmed = rawLine.trim();

          if (!currentMain && trimmed === "") {
            continue;
          }

          // Detect subquestion: "1.1. TEXT"
          const subMatch = trimmed.match(/^(\d+\.\d+)\.\s*(.*)$/);
          if (subMatch) {
            if (currentSub && currentMain) {
              currentMain.subs.push(currentSub);
            }

            const subId = subMatch[1];
            const subTitle = subMatch[2];
            currentSub = {
              id: subId,
              title: subTitle,
              answerLines: []
            };
            continue;
          }

          // Detect main question: "1. TEXT" but NOT "1.1."
          const mainMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
          if (mainMatch && !trimmed.match(/^\d+\.\d+\./)) {
            if (currentSub && currentMain) {
              currentMain.subs.push(currentSub);
            }
            if (currentMain) {
              mainQuestions.push(currentMain);
            }

            const mainId = mainMatch[1];
            const mainTitle = mainMatch[2];

            currentMain = {
              id: mainId,
              title: mainTitle,
              subs: [],
              defaultLines: []
            };
            currentSub = null;
            continue;
          }

          // Regular content line:
          if (currentSub && currentMain) {
            currentSub.answerLines.push(line);
          } else if (currentMain) {
            currentMain.defaultLines.push(line);
          }
        }

        if (currentSub && currentMain) {
          currentMain.subs.push(currentSub);
        }
        if (currentMain) {
          mainQuestions.push(currentMain);
        }

        // Render UI
        mainQuestions.forEach(mainQ => {
          const mainDiv = document.createElement("div");
          mainDiv.className = "main-question-block";

          const mainBtn = document.createElement("button");
          mainBtn.className = "question-btn";
          mainBtn.textContent = mainQ.id + ". " + mainQ.title;

          const subContainer = document.createElement("div");
          subContainer.className = "subquestions";

          let defaultAns = null;
          if (mainQ.defaultLines && mainQ.defaultLines.join("").trim().length > 0) {
            defaultAns = document.createElement("pre");
            defaultAns.className = "answer";
            defaultAns.textContent = mainQ.defaultLines.join("\n").trim();
          }

          mainQ.subs.forEach(subQ => {
            const subDiv = document.createElement("div");

            const subBtn = document.createElement("button");
            subBtn.className = "subquestion-btn";
            subBtn.textContent = subQ.id + ". " + subQ.title;

            const ans = document.createElement("pre");
            ans.className = "answer";
            ans.textContent = subQ.answerLines.join("\n").trim();

            subBtn.addEventListener("click", () => {
              const isHidden = ans.style.display === "none" || ans.style.display === "";
              ans.style.display = isHidden ? "block" : "none";
            });

            subDiv.appendChild(subBtn);
            subDiv.appendChild(ans);
            subContainer.appendChild(subDiv);
          });

          mainBtn.addEventListener("click", () => {
            if (mainQ.subs.length > 0) {
              const isHidden = subContainer.style.display === "none" || subContainer.style.display === "";
              subContainer.style.display = isHidden ? "block" : "none";
            }
            if (defaultAns) {
              const isHidden = defaultAns.style.display === "none" || defaultAns.style.display === "";
              defaultAns.style.display = isHidden ? "block" : "none";
            }
          });

          mainDiv.appendChild(mainBtn);

          if (mainQ.subs.length > 0) {
            mainDiv.appendChild(subContainer);
          }

          if (defaultAns) {
            mainDiv.appendChild(defaultAns);
          }

          container.appendChild(mainDiv);
        });

        const showAllBtn = document.getElementById("showAllBeh");
        const behDetails = document.getElementById("beh-section");
        const collapseBtn = document.getElementById("collapseBeh");
        let allVisible = false;

        showAllBtn.addEventListener("click", () => {
          allVisible = !allVisible;
          const answers = container.querySelectorAll(".answer");
          answers.forEach(a => {
            a.style.display = allVisible ? "block" : "none";
          });
          showAllBtn.textContent = allVisible ? "Hide all answers" : "Show all answers";

          const subContainers = container.querySelectorAll(".subquestions");
          subContainers.forEach(sc => {
            sc.style.display = allVisible ? "block" : sc.style.display;
          });
        });

        collapseBtn.addEventListener("click", () => {
          behDetails.open = false;
        });

        behDetails.addEventListener("toggle", () => {
          if (behDetails.open) {
            const answers = container.querySelectorAll(".answer");
            answers.forEach(a => {
              a.style.display = "none";
            });
            allVisible = false;
            showAllBtn.textContent = "Show all answers";
          }
        });
      })
      .catch(err => {
        const container = document.getElementById("beh-questions");
        container.textContent = "Error loading Behavioral Questions.txt";
      });
  }

  // Load Behavioral Q&A
  loadBehavioralQA("Behavioral Questions.html");

  /**
   * Load and parse Implemented Projects.txt which contains:
   * - AI SOFTWARE ENGINEER INTERVIEW QUESTIONS
   * - Recommended AI Interview Question Resources
   * - WORK EXPERIENCE
   * - PROJECTS
   */
  function loadImplementedProjects(file) {
    fetch(file)
      .then(response => response.text())
      .then(text => {
        const lines = text.split(/\r?\n/);

        let currentSection = null;
        const sections = {
          aiQuestions: [],
          resources: [],
          work: [],
          projects: []
        };

        lines.forEach(line => {
          const trimmed = line.trim();

          if (trimmed === "AI SOFTWARE ENGINEER INTERVIEW QUESTIONS") {
            currentSection = "aiQuestions";
            return;
          }
          if (trimmed === "Recommended AI Interview Question Resources") {
            currentSection = "resources";
            return;
          }
          if (trimmed === "WORK EXPERIENCE") {
            currentSection = "work";
            return;
          }
          if (trimmed === "PROJECTS") {
            currentSection = "projects";
            return;
          }

          // ignore pure separator lines but keep others
          if (trimmed === "________________________________________") {
            // keep separators inside wherever needed
            if (currentSection && sections[currentSection]) {
              sections[currentSection].push(trimmed);
            }
            return;
          }

          if (currentSection && sections[currentSection]) {
            sections[currentSection].push(line);
          }
        });

        // Fill the pre blocks
        const aiQ = document.getElementById("ai-questions");
        const aiR = document.getElementById("ai-resources");
        const aiW = document.getElementById("ai-work");
        const aiP = document.getElementById("ai-projects");

        aiQ.textContent = (sections.aiQuestions || []).join("\n").trim();
        aiR.textContent = (sections.resources || []).join("\n").trim();
        aiW.textContent = (sections.work || []).join("\n").trim();
        aiP.textContent = (sections.projects || []).join("\n").trim();
      })
      .catch(err => {
        document.getElementById("ai-questions").textContent = "Error loading Implemented Projects.txt";
      });
  }

  // Load Implemented Projects / AI SWE data
  loadImplementedProjects("Implemented Projects.txt");
</script>

</body>
</html>
