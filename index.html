<!DOCTYPE html>
<html>
<head>
  <title>My Learning</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    .section {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
    }

    summary {
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      padding: 10px 0;
    }

    pre {
      background: #eee;
      padding: 15px;
      border-radius: 5px;
      white-space: pre-wrap;
    }

    /* Behavioral Q&A styling */
    #beh-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    #showAllBeh {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      background: #007bff;
      color: white;
    }

    #showAllBeh:hover {
      opacity: 0.9;
    }

    .main-question-block {
      margin-bottom: 12px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .question-btn {
      width: 100%;
      text-align: left;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f0f0f0;
      cursor: pointer;
    }

    .question-btn:hover {
      background: #e5e5e5;
    }

    .subquestions {
      margin-top: 6px;
      margin-left: 15px;
      display: none; /* hidden until main question clicked */
    }

    .subquestion-btn {
      width: 100%;
      text-align: left;
      padding: 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fafafa;
      cursor: pointer;
      margin-top: 4px;
    }

    .subquestion-btn:hover {
      background: #f1f1f1;
    }

    .answer {
      margin-top: 4px;
      display: none; /* hidden by default */
    }
  </style>
</head>

<body>

<h1>📘 My Learning Hub</h1>

<!-- Section 1: Behavioral Questions (Nested Q / sub-Q / answer) -->
<div class="section">
  <h2>1. Behavioral Questions</h2>

  <div id="beh-controls">
    <button id="showAllBeh">Show all answers</button>
  </div>

  <div id="beh-questions">
    <!-- Main questions, subquestions, and answers will be injected here -->
  </div>
</div>

<!-- Section 2 -->
<details class="section">
  <summary>2. Leetcode Problems</summary>
  <pre id="leet"></pre>
</details>

<!-- Section 3 -->
<details class="section">
  <summary>3. Implemented Projects</summary>
  <pre id="proj"></pre>
</details>

<!-- Section 4 -->
<details class="section">
  <summary>4. System Design</summary>
  <pre id="sys"></pre>
</details>

<script>
  // Helper to load simple text files into <pre>
  function loadFile(id, file) {
    fetch(file)
      .then(response => response.text())
      .then(text => document.getElementById(id).textContent = text)
      .catch(err => document.getElementById(id).textContent = "Error loading " + file);
  }

  // Load Leetcode / Projects / System Design as before
  loadFile("leet", "Leetcode Problems.txt");
  loadFile("proj", "Implemented Projects.txt");
  loadFile("sys", "System Design.txt");

  /**
   * Load and parse Behavioral Questions.txt into:
   *  - main questions:  "1. ...", "2. ..."
   *  - subquestions:    "1.1. ...", "1.2. ..."
   *
   * Assumptions:
   *  - Main question line format:    "1. Some question text"
   *  - Subquestion line format:     "1.1. Some variant text"
   *  - The answer for a subquestion is all following lines
   *    until the next subquestion or main question.
   */
  function loadBehavioralQA(file) {
    fetch(file)
      .then(response => response.text())
      .then(text => {
        const container = document.getElementById("beh-questions");
        const lines = text.split(/\r?\n/);

        const mainQuestions = [];
        let currentMain = null;
        let currentSub = null;

        for (let rawLine of lines) {
          const line = rawLine;             // keep original formatting for answers
          const trimmed = rawLine.trim();

          if (!currentMain && trimmed === "") {
            continue; // skip leading empty lines
          }

          // Detect subquestion first: "1.1. TEXT"
          let subMatch = trimmed.match(/^(\d+\.\d+)\.\s*(.*)$/);
          if (subMatch) {
            // Close previous subquestion
            if (currentSub && currentMain) {
              currentMain.subs.push(currentSub);
            }

            const subId = subMatch[1];      // e.g. "1.1"
            const subTitle = subMatch[2];   // e.g. "SOFTWARE ENGINEERING (SE)"
            currentSub = {
              id: subId,
              title: subTitle,
              answerLines: []
            };
            continue;
          }

          // Detect main question: "1. TEXT" but NOT "1.1."
          let mainMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
          if (mainMatch && !trimmed.match(/^\d+\.\d+\./)) {
            // Close previous subquestion and main question
            if (currentSub && currentMain) {
              currentMain.subs.push(currentSub);
            }
            if (currentMain) {
              mainQuestions.push(currentMain);
            }

            const mainId = mainMatch[1];   // e.g. "1"
            const mainTitle = mainMatch[2];

            currentMain = {
              id: mainId,
              title: mainTitle,
              subs: []
            };
            currentSub = null;
            continue;
          }

          // Regular content line -> belongs to current subquestion (if any)
          if (currentSub) {
            currentSub.answerLines.push(line);
          }
        }

        // Push any remaining subquestion and main question
        if (currentSub && currentMain) {
          currentMain.subs.push(currentSub);
        }
        if (currentMain) {
          mainQuestions.push(currentMain);
        }

        // Render UI
        mainQuestions.forEach(mainQ => {
          const mainDiv = document.createElement("div");
          mainDiv.className = "main-question-block";

          // Main question button (e.g., "1. Tell me about a time...")
          const mainBtn = document.createElement("button");
          mainBtn.className = "question-btn";
          mainBtn.textContent = mainQ.id + ". " + mainQ.title;

          // Subquestions container (hidden by default)
          const subContainer = document.createElement("div");
          subContainer.className = "subquestions";

          mainQ.subs.forEach(subQ => {
            const subDiv = document.createElement("div");

            // Subquestion button (e.g., "1.1. SOFTWARE ENGINEERING (SE)")
            const subBtn = document.createElement("button");
            subBtn.className = "subquestion-btn";
            subBtn.textContent = subQ.id + ". " + subQ.title;

            // Answer block
            const ans = document.createElement("pre");
            ans.className = "answer";
            ans.textContent = subQ.answerLines.join("\n").trim();

            // Toggle answer on subquestion click
            subBtn.addEventListener("click", () => {
              const isHidden = ans.style.display === "none" || ans.style.display === "";
              ans.style.display = isHidden ? "block" : "none";
            });

            subDiv.appendChild(subBtn);
            subDiv.appendChild(ans);
            subContainer.appendChild(subDiv);
          });

          // Toggle subquestions on main question click
          mainBtn.addEventListener("click", () => {
            const isHidden = subContainer.style.display === "none" || subContainer.style.display === "";
            subContainer.style.display = isHidden ? "block" : "none";
          });

          mainDiv.appendChild(mainBtn);
          mainDiv.appendChild(subContainer);
          container.appendChild(mainDiv);
        });

        // Show all / hide all answers
        const showAllBtn = document.getElementById("showAllBeh");
        let allVisible = false;

        showAllBtn.addEventListener("click", () => {
          allVisible = !allVisible;
          const answers = container.querySelectorAll(".answer");
          answers.forEach(a => {
            a.style.display = allVisible ? "block" : "none";
          });
          showAllBtn.textContent = allVisible ? "Hide all answers" : "Show all answers";

          // Optionally also expand all subquestion containers when showing all
          const subContainers = container.querySelectorAll(".subquestions");
          subContainers.forEach(sc => {
            sc.style.display = allVisible ? "block" : sc.style.display;
          });
        });
      })
      .catch(err => {
        const container = document.getElementById("beh-questions");
        container.textContent = "Error loading Behavioral Questions.txt";
      });
  }

  // Start loading behavioral Q&A
  loadBehavioralQA("Behavioral Questions.txt");
</script>

</body>
</html>
